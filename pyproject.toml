[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demand-forecasting-capacity-planning"
version = "0.1.0"
description = "Hourly demand forecasting with calibrated uncertainty and the capacity-commitment decision it supports; case study on U.S. grid data (EIA-930)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/capacity_planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
